
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101b30;
  color: white;
}

.header {
  padding: 16px 24px;
}

.header small {
  color: #a9c7e8;
  letter-spacing: 2px;
}

h1 {
  font-size: clamp(18px, 3vw, 30px);
  margin: 8px 0;
}

.subtitle { color: #c4d3e5; }

.image {
  width: 100%;
  height: 260px;
  object-fit: cover;
  display: block;
}

.details {
  padding: 14px 24px 18px;
  background: #101b30;
}

.details h2 {
  margin: 0 0 8px;
  font-size: 20px;
}

.date, .credit {
  color: #a9c7e8;
  font-size: 11px;
}

a {
  color: #8fc5ff;
  text-decoration: none;
}

#status {
  padding: 24px;
}
</style>
</head>

<body>

<header class="header">
  <small>NASA · SCIENCE</small>
  <h1>ASTRONOMY PICTURE OF THE DAY</h1>
  <div class="subtitle">
    Explore the universe, one day at a time.
  </div>
</header>

<div id="status">Loading today's astronomical image...</div>

<div class="details" id="details" hidden>
  <h2 id="title"></h2>
  <p class="date" id="date"></p>
  <p class="credit" id="credit"></p>
  <a id="link" target="_blank" rel="noopener">
    Explore today's NASA feature ↗
  </a>
</div>

<script>

async function loadAPOD() {
  const status = document.getElementById("status");

  try {
    // Retrieve today's APOD
    const response = await fetch(
      "https://science.nasa.gov/wp-json/wp/v2/apod-basic",
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error("NASA feed unavailable");

    const result = await response.json();
    const today = Array.isArray(result) ? result[0] : result;

    let selected = today;
    let archiveImage = false;

    // Check whether today's entry has a usable image
    const todayImage = await getImage(today);

    if (!todayImage) {
      // Retrieve random historical APOD entries
      const archiveResponse = await fetch(
        "https://science.nasa.gov/wp-json/wp/v2/apod-basic?count=25",
        { cache: "no-store" }
      );

      if (!archiveResponse.ok) {
        throw new Error("Unable to retrieve NASA archive");
      }

      const archive = await archiveResponse.json();

      const candidates = Array.isArray(archive)
        ? archive
        : [archive];

      // Find a random entry with a usable image
      const shuffled = candidates.sort(
        () => Math.random() - 0.5
      );

      for (const entry of shuffled) {
        const image = await getImage(entry);

        if (image) {
          selected = entry;
          selected._image = image;
          archiveImage = true;
          break;
        }
      }

      if (!selected._image) {
        throw new Error("No usable archive photographs found");
      }
    } else {
      selected._image = todayImage;
    }

    // Display selected image
    const img = document.createElement("img");
    img.className = "image";
    img.src = selected._image;
    img.alt = selected.title || "NASA astronomy photograph";

    img.onerror = () => {
      status.textContent = "Unable to load the selected image.";
    };

    status.replaceWith(img);

    document.getElementById("title").textContent =
      selected.title || "Astronomy Picture of the Day";

    document.getElementById("date").textContent =
      archiveImage
        ? "ARCHIVE IMAGE · " + selected.date
        : selected.date;

    document.getElementById("credit").textContent =
      selected.copyright || selected.credit || "NASA";

    document.getElementById("link").href =
      selected.permalink || selected.url;

    document.getElementById("details").hidden = false;

    // Update heading to reflect archive selection
    if (archiveImage) {
      document.querySelector(".header h1").textContent =
        "FROM THE NASA ASTRONOMY ARCHIVE";
    }

  } catch (error) {
    console.error("APOD Error:", error);
    status.textContent =
      "Unable to load an astronomical photograph. Please try again later.";
  }
}

// Extract an actual photograph from an APOD entry
async function getImage(data) {
  if (!data) return null;

  const page = new DOMParser().parseFromString(
    data.basic_html || "",
    "text/html"
  );

  const metaImage = page.querySelector(
    'meta[property="og:image"]'
  );

  let imageURL = metaImage?.content || "";

  if (!imageURL && data.hdurl &&
      !data.hdurl.includes("nasa-logo")) {
    imageURL = data.hdurl;
  }

  if (!imageURL) {
    const candidate = Array.from(
      page.querySelectorAll("img")
    ).find(img => {
      const src =
        img.getAttribute("data-src") ||
        img.getAttribute("src");

      return src &&
        !src.startsWith("data:") &&
        !src.includes("nasa-logo");
    });

    if (candidate) {
      imageURL =
        candidate.getAttribute("data-src") ||
        candidate.getAttribute("src");
    }
  }

  if (!imageURL) return null;

  return imageURL;
}

loadAPOD();

</script>

</body>
</html>
