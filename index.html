
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101b30;
    color: white;
  }
  .banner { width: 100%; }
  .header {
    padding: 18px 24px;
  }
  .header small {
    color: #a9c7e8;
    letter-spacing: 2px;
  }
  h1 {
    font-size: clamp(18px, 3vw, 30px);
    margin: 8px 0;
  }
  .subtitle { color: #c4d3e5; }
  .image {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
  }
  .details {
    padding: 14px 24px 18px;
    background: #101b30;
  }
  .details h2 { margin: 0 0 6px; font-size: 20px; }
  .date, .credit {
    color: #a9c7e8;
    font-size: 11px;
  }
  a { color: #8fc5ff; text-decoration: none; }
  #status { padding: 20px; }
</style>
</head>
<body>
<div class="banner">
  <header class="header">
    <small>NASA · SCIENCE</small>
    <h1>ASTRONOMY PICTURE OF THE DAY</h1>
    <div class="subtitle">
      Explore the universe, one day at a time.
    </div>
  </header>

  <div id="status">Loading today's image...</div>

  <div class="details" id="details" hidden>
    <h2 id="title"></h2>
    <p class="date" id="date"></p>
    <p class="credit" id="credit"></p>
    <a id="link" target="_blank" rel="noopener">
      Explore today's image ↗
    </a>
  </div>
</div>

<script>

async function loadAPOD() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(
      "https://science.nasa.gov/wp-json/wp/v2/apod-basic"
    );

    if (!response.ok) {
      throw new Error("NASA feed unavailable");
    }

    const data = await response.json();

    document.getElementById("title").textContent =
      data.title || "Astronomy Picture of the Day";

    document.getElementById("date").textContent =
      data.date || "";

    document.getElementById("credit").textContent =
      data.credit || data.copyright || "NASA";

    const link = document.getElementById("link");
    link.href = data.permalink || data.url || 
      "https://apod.nasa.gov/apod/astropix.html";

    const imageURL = data.hdurl;

    if (imageURL) {
      const img = document.createElement("img");

      img.className = "image";
      img.src = imageURL;
      img.alt = data.alt || data.title || "NASA astronomy image";

      img.onerror = () => {
        img.remove();
        status.textContent =
          "Image unavailable. Visit NASA for today's feature.";
      };

      status.replaceWith(img);

    } else {
      status.textContent =
        "Today's feature does not have an available image preview. " +
        "Visit NASA to explore it.";
    }

    document.getElementById("details").hidden = false;

  } catch (error) {
    status.textContent =
      "Unable to load today's NASA image. Please try again later.";

    console.error(error);
  }
}

loadAPOD();


loadAPOD();
</script>
</body>
</html>
