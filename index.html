
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101b30;
  color: white;
}

.header {
  padding: 16px 24px;
}

.header small {
  color: #a9c7e8;
  letter-spacing: 2px;
}

h1 {
  font-size: clamp(18px, 3vw, 30px);
  margin: 8px 0;
}

.subtitle { color: #c4d3e5; }

.image {
  width: 100%;
  height: 260px;
  object-fit: cover;
  display: block;
}

.details {
  padding: 14px 24px 18px;
  background: #101b30;
}

.details h2 {
  margin: 0 0 8px;
  font-size: 20px;
}

.date, .credit {
  color: #a9c7e8;
  font-size: 11px;
}

a {
  color: #8fc5ff;
  text-decoration: none;
}

#status {
  padding: 24px;
}
</style>
</head>

<body>

<header class="header">
  <small>NASA · SCIENCE</small>
  <h1>ASTRONOMY PICTURE OF THE DAY</h1>
  <div class="subtitle">
    Explore the universe, one day at a time.
  </div>
</header>

<div id="status">Loading today's astronomical image...</div>

<div class="details" id="details" hidden>
  <h2 id="title"></h2>
  <p class="date" id="date"></p>
  <p class="credit" id="credit"></p>
  <a id="link" target="_blank" rel="noopener">
    Explore today's NASA feature ↗
  </a>
</div>

<script>
async function loadAPOD() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(
      "https://science.nasa.gov/wp-json/wp/v2/apod-basic?per_page=1",
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("NASA returned status " + response.status);
    }

    const results = await response.json();
    const data = Array.isArray(results) ? results[0] : results;

    if (!data) throw new Error("No APOD data returned.");

    // Extract the actual image from NASA's HTML
    const page = new DOMParser().parseFromString(
      data.basic_html || "", "text/html"
    );

    let imageURL = "";

    // Look for the APOD image in the HTML
    const metaImage = page.querySelector(
      'meta[property="og:image"]'
    );

    if (metaImage) {
      imageURL = metaImage.content;
    }

    if (!imageURL) {
      const images = Array.from(page.querySelectorAll("img"));

      const candidate = images.find(img => {
        const src =
          img.getAttribute("data-src") ||
          img.getAttribute("src");

        return src &&
          !src.includes("nasa-logo") &&
          !src.startsWith("data:");
      });

      if (candidate) {
        imageURL =
          candidate.getAttribute("data-src") ||
          candidate.getAttribute("src");
      }
    }

    // Use NASA's featured image as a fallback
    if (!imageURL && data.hdurl &&
        !data.hdurl.includes("nasa-logo")) {
      imageURL = data.hdurl;
    }

    if (!imageURL) {
      throw new Error(
        "NASA's response did not contain a usable image URL."
      );
    }

    const img = document.createElement("img");
    img.className = "image";
    img.src = imageURL;
    img.alt = data.alt || data.title || "NASA APOD";

    img.onerror = () => {
      status.textContent =
        "NASA's image could not be loaded. Please visit the original entry.";
    };

    status.replaceWith(img);

    document.getElementById("title").textContent =
      data.title || "Astronomy Picture of the Day";

    document.getElementById("date").textContent =
      data.date || "";

    document.getElementById("credit").textContent =
      data.copyright || "";

    document.getElementById("link").href =
      data.permalink || data.url;

    document.getElementById("details").hidden = false;

  } catch (error) {
    console.error("APOD Error:", error);

    status.textContent =
      "Unable to load today's NASA image: " + error.message;
  }
}

loadAPOD();
</script>

</body>
</html>
